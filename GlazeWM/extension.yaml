Id: GlazeWM_29dd6716-dc8d-43b1-ab90-29954cfea2e7
Name: GlazeWM
Author: kevin
Version: 1.0
Module: GlazeWMPlaynite.dll
Type: GenericPlugin
Description: >
  Feeds display and app info for your games to GlazeWM, so GlazeWM can manage
  them.

  Right-click a game and say which monitor it plays on. Playnite already knows
  what and where every game is; this hands that off to the window manager, which
  gives the game its own workspace, moves it to that monitor and fullscreens it
  the WM's way. The window chrome is stripped in-process so the game reads as an
  ordinary window.

  It NEVER changes the primary display — that re-anchors the whole desktop
  coordinate space and forces the WM to re-layout every monitor. It assumes the
  game is already windowed at the right resolution for the target screen.

  Borderless Gaming and Display Helper are REFERENCES, not dependencies; neither
  needs to be installed. A game carrying Display Helper's own "[RC] Display:"
  feature is left completely alone, so Display Helper remains the fallback for
  titles that genuinely need exclusive fullscreen.

  Monitor names come from ~/.config/monitors.json rather than \\.\DISPLAYn, which
  Windows renumbers on driver resets and display-config changes.
