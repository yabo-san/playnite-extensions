Version: 1.1.0 # x-release-please-version
Module: RohanKarPlaynite.dll
Type: GameLibrary
Description: >
  Imports the y4bo launcher's library into Playnite and keeps it in step.

  It reads playnite-export.json, which the launcher rewrites next to its
  library.db on every library change, and watches it, so installs, uninstalls
  and launches in the launcher show up in Playnite within a second. Each game's
  Play button runs the exe the launcher picked.

  Install, uninstall and "open in launcher" go through the launcher's own CLI.
  Games the launcher stops listing stay in Playnite, marked not installed, and a
  cover or background you set in Playnite is never replaced.
