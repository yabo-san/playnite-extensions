name: RohanKar release

# Every push to main updates a release PR for the plugin (version and changelog
# from conventional commits touching RohanKar/). Merging that PR tags
# rohankar-playnite-vX.Y.Z and creates the release; the .pext is then built
# from the tag and attached to it.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['RohanKar--release_created'] }}
      tag_name: ${{ steps.release.outputs['RohanKar--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT or app token lets CI run on the release PR; GITHUB_TOKEN does not
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pext:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests
        run: dotnet test RohanKar.Tests --nologo

      - name: Build
        run: dotnet build RohanKar -c Release --nologo

      - name: Pack .pext
        run: bash RohanKar/pack.sh

      - name: Attach .pext to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" RohanKar/bin/*.pext --clobber
