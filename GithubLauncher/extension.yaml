Id: GithubLauncher_6c0f1a92-64f7-4d3a-9f0e-2a7f5b1d8c34
Name: GithubLauncher
Author: kevin
Version: 0.9
Module: GithubLauncherPlaynite.dll
Type: GameLibrary
Description: >
  Imports SirDiabo's GithubLauncher library into Playnite.

  GithubLauncher ships a documented command line, which is a better integration
  surface than its on-disk files: --list enumerates games and --run <name> plays
  one, auto-updating it first. A raw path to the game's own executable would skip
  that update, so the plugin launches through the launcher rather than around it.

  STATUS 0.9 - the CLI is verified (--list runs, and reports an empty library
  correctly), but the shape of --list output WITH games in it is not, because the
  library here is empty. The parser is conservative and logs the raw output to the
  Playnite log, so the first real run shows the true format instead of failing
  quietly. Expect the list parsing to need one correction.
